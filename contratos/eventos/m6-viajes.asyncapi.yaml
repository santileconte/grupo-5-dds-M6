asyncapi: 3.0.0
info:
  title: M6 - Viajes y Ciclo de Vida (eventos)
  version: 0.1.0
  description: |
    Eventos que **publica** el módulo M6 (Grupo 5). Es el aporte de M6 al catálogo común de
    eventos del consorcio (RNF-03). El índice legible está en `docs/catalogo-eventos.md`.

    **Convenciones**
    - Broker: RabbitMQ (RNF-10, TP2). Exchange `movilidad.eventos`, de tipo `topic` y durable.
    - Routing key: `<modulo>.<entidad>.<hecho-en-pasado>`, por ejemplo `trips.trip.completed`.
      Cada consumidor crea su propia cola y la enlaza con las routing keys que le interesan
      (por ejemplo `trips.#`).
    - Todos los mensajes usan el mismo sobre (`SobreEvento`). Los datos propios del evento van en `payload`.
    - Propiedades AMQP de cada mensaje: `message_id` = `eventId`, `correlation_id` = `correlationId`,
      `type` = `eventType`, `content_type` = `application/json`, `delivery_mode` = 2 (persistente).
    - Entrega **al menos una vez**: un evento puede llegar repetido. Los consumidores deben
      descartar duplicados por `eventId` (RNF-09).
    - Orden: sólo se garantiza por viaje. Si llega un evento de un viaje con `tripVersion`
      menor o igual a la última procesada, se puede ignorar.
    - Privacidad (RNF-19, RF-4.7): los eventos no llevan coordenadas, direcciones, datos personales
      ni el código QR. Quien necesite más datos consulta `GET /trips/{tripId}` con sus permisos.
    - Versionado: un cambio incompatible incrementa `eventVersion` y se publica en paralelo con la versión
      anterior durante la transición.
defaultContentType: application/json

servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ local (docker compose del equipo integrador).

channels:
  tripCreated:
    address: trips.trip.created
    title: Trip created
    messages:
      TripCreated:
        $ref: '#/components/messages/TripCreated'
    bindings:
      $ref: '#/components/channelBindings/exchangeMovilidad'
  driverArrived:
    address: trips.driver.arrived
    title: Driver arrived
    messages:
      DriverArrived:
        $ref: '#/components/messages/DriverArrived'
    bindings:
      $ref: '#/components/channelBindings/exchangeMovilidad'
  tripStarted:
    address: trips.trip.started
    title: Trip started
    messages:
      TripStarted:
        $ref: '#/components/messages/TripStarted'
    bindings:
      $ref: '#/components/channelBindings/exchangeMovilidad'
  tripCompleted:
    address: trips.trip.completed
    title: Trip completed
    messages:
      TripCompleted:
        $ref: '#/components/messages/TripCompleted'
    bindings:
      $ref: '#/components/channelBindings/exchangeMovilidad'
  tripCancelled:
    address: trips.trip.cancelled
    title: Trip cancelled
    messages:
      TripCancelled:
        $ref: '#/components/messages/TripCancelled'
    bindings:
      $ref: '#/components/channelBindings/exchangeMovilidad'

operations:
  publishTripCreated:
    action: send
    bindings:
      $ref: '#/components/operationBindings/publicacionPersistente'
    channel:
      $ref: '#/channels/tripCreated'
    summary: Se publica al crear el viaje (estado PENDING_ARRIVAL).
    messages:
      - $ref: '#/channels/tripCreated/messages/TripCreated'
  publishDriverArrived:
    action: send
    bindings:
      $ref: '#/components/operationBindings/publicacionPersistente'
    channel:
      $ref: '#/channels/driverArrived'
    summary: Se publica cuando el conductor registra el arribo.
    messages:
      - $ref: '#/channels/driverArrived/messages/DriverArrived'
  publishTripStarted:
    action: send
    bindings:
      $ref: '#/components/operationBindings/publicacionPersistente'
    channel:
      $ref: '#/channels/tripStarted'
    summary: Se publica cuando el viaje pasa a IN_PROGRESS.
    messages:
      - $ref: '#/channels/tripStarted/messages/TripStarted'
  publishTripCompleted:
    action: send
    bindings:
      $ref: '#/components/operationBindings/publicacionPersistente'
    channel:
      $ref: '#/channels/tripCompleted'
    summary: Se publica cuando el viaje pasa a COMPLETED.
    messages:
      - $ref: '#/channels/tripCompleted/messages/TripCompleted'
  publishTripCancelled:
    action: send
    bindings:
      $ref: '#/components/operationBindings/publicacionPersistente'
    channel:
      $ref: '#/channels/tripCancelled'
    summary: Se publica cuando el viaje pasa a CANCELLED.
    messages:
      - $ref: '#/channels/tripCancelled/messages/TripCancelled'

components:
  channelBindings:
    exchangeMovilidad:
      amqp:
        is: routingKey
        exchange:
          name: movilidad.eventos
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0

  operationBindings:
    publicacionPersistente:
      amqp:
        # 2 = persistente: el mensaje sobrevive a un reinicio del broker.
        deliveryMode: 2
        bindingVersion: 0.3.0

  messages:
    TripCreated:
      name: TripCreated
      title: Trip created
      summary: Un conductor quedó asignado y el viaje comenzó su ciclo de vida.
      description: |
        **Consumidores sugeridos:**
        - M8: notificar la asignación al cliente (RF-8.1) y generar el QR de un solo uso (RF-8.3).
        - M9: vincular la reserva con el viaje, si `reservationId` no es nulo.
      correlationId:
        $ref: '#/components/correlationIds/byTrip'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType:
                const: TripCreated
              payload:
                $ref: '#/components/schemas/TripCreatedPayload'
      examples:
        - name: tripCreated
          payload:
            eventId: 2d5e1f0a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
            eventType: TripCreated
            eventVersion: 1
            occurredAt: '2026-10-08T12:00:00Z'
            producer: m6-viajes
            correlationId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
            payload:
              tripId: 7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11
              tripVersion: 1
              requestId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
              reservationId: null
              clientId: 3f1b2c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              driverId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              vehicleId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e
              vehicleType: CAR
              createdAt: '2026-10-08T12:00:00Z'

    DriverArrived:
      name: DriverArrived
      title: Driver arrived
      summary: El conductor llegó al punto de retiro.
      description: |
        **Consumidores sugeridos:**
        - M8: avisar al cliente que el conductor llegó (RF-8.1).
      correlationId:
        $ref: '#/components/correlationIds/byTrip'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType:
                const: DriverArrived
              payload:
                $ref: '#/components/schemas/DriverArrivedPayload'

    TripStarted:
      name: TripStarted
      title: Trip started
      summary: Se validó el QR y el viaje está en curso.
      description: |
        **Consumidores sugeridos:**
        - M8: notificar el inicio (RF-8.1).
        - M7: autorizar el pago, si la regla acordada lo hace al inicio (RF-7.3).
      correlationId:
        $ref: '#/components/correlationIds/byTrip'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType:
                const: TripStarted
              payload:
                $ref: '#/components/schemas/TripStartedPayload'

    TripCompleted:
      name: TripCompleted
      title: Trip completed
      summary: El conductor cerró el viaje con distancia y duración.
      description: |
        **Consumidores sugeridos:**
        - M7: calcular el importe final, capturar el pago y liquidar al conductor (RF-7.3, RF-7.8).
        - M8: notificar la finalización y generar el comprobante (RF-8.1, RF-8.4).
        - M2 y M3: habilitar las calificaciones del viaje (RF-2.5, RF-3.7).
        - M4: liberar la disponibilidad del conductor (RF-4.4).
        - M9: cerrar la reserva vinculada, si existe.
      correlationId:
        $ref: '#/components/correlationIds/byTrip'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType:
                const: TripCompleted
              payload:
                $ref: '#/components/schemas/TripCompletedPayload'
      examples:
        - name: tripCompleted
          payload:
            eventId: 6f7a8b9c-0d1e-4f2a-8b3c-4d5e6f7a8b9c
            eventType: TripCompleted
            eventVersion: 1
            occurredAt: '2026-10-08T12:22:00Z'
            producer: m6-viajes
            correlationId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
            payload:
              tripId: 7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11
              tripVersion: 4
              requestId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
              reservationId: null
              clientId: 3f1b2c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              driverId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              vehicleType: CAR
              startedAt: '2026-10-08T12:07:00Z'
              completedAt: '2026-10-08T12:22:00Z'
              distanceKm: 4.2
              durationSeconds: 900

    TripCancelled:
      name: TripCancelled
      title: Trip cancelled
      summary: El viaje se canceló, con motivo y actor.
      description: |
        **Consumidores sugeridos:**
        - M5: si `requiresRedispatch` es verdadero, volver a buscar conductor para la solicitud (RF-6.7).
        - M7: decidir y registrar el cargo de cancelación, o el reintegro (RF-7.4, RF-7.5).
        - M8: notificar la cancelación (RF-8.1).
        - M4: liberar la disponibilidad del conductor (RF-4.4).
        - M9: actualizar la reserva vinculada, si existe.
      correlationId:
        $ref: '#/components/correlationIds/byTrip'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType:
                const: TripCancelled
              payload:
                $ref: '#/components/schemas/TripCancelledPayload'
      examples:
        - name: cancelledByDriver
          summary: El conductor cancela antes del arribo; la solicitud vuelve a despacho.
          payload:
            eventId: 9c8b7a6f-5e4d-4c3b-8a29-1f0e9d8c7b6a
            eventType: TripCancelled
            eventVersion: 1
            occurredAt: '2026-10-08T12:03:00Z'
            producer: m6-viajes
            correlationId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
            payload:
              tripId: 7b0e3a8e-4f7c-4d1a-9a52-1f0c2f9d6b11
              tripVersion: 2
              requestId: 0c6a4f0e-8f43-4d3b-a3b7-6a1f2c8e9d10
              reservationId: null
              clientId: 3f1b2c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              driverId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
              vehicleType: CAR
              cancelledBy: DRIVER
              reason: VEHICLE_PROBLEM
              previousState: PENDING_ARRIVAL
              requiresRedispatch: true
              createdAt: '2026-10-08T12:00:00Z'
              arrivedAt: null
              startedAt: null
              cancelledAt: '2026-10-08T12:03:00Z'

  correlationIds:
    byTrip:
      description: Identificador de correlación de punta a punta (normalmente el de la solicitud o la reserva).
      location: $message.payload#/correlationId

  schemas:
    EventEnvelope:
      type: object
      description: Sobre común a todos los eventos del consorcio.
      required: [eventId, eventType, eventVersion, occurredAt, producer, correlationId, payload]
      properties:
        eventId:
          type: string
          format: uuid
          description: Único por evento. Se usa para descartar duplicados.
        eventType:
          type: string
          description: Nombre del evento, en PascalCase.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del esquema de `payload`.
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          description: Módulo que publica el evento.
          examples: [m6-viajes]
        correlationId:
          type: string
          description: Se propaga desde el header `X-Correlation-Id` (RNF-14).
        payload:
          type: object

    VehicleType:
      type: string
      enum: [CAR, MOTORCYCLE]

    TripState:
      type: string
      enum: [PENDING_ARRIVAL, DRIVER_ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]

    Role:
      type: string
      enum: [CLIENT, DRIVER, OPERATOR]

    CancellationReason:
      type: string
      enum:
        - CHANGE_OF_PLANS
        - EXCESSIVE_DELAY
        - DRIVER_NO_SHOW
        - CLIENT_NO_SHOW
        - VEHICLE_PROBLEM
        - ORIGIN_UNREACHABLE
        - SECURITY_INCIDENT
        - ADMINISTRATIVE_BLOCK
        - OTHER

    NullableId:
      oneOf:
        - type: string
          format: uuid
        - type: 'null'

    NullableDateTime:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'

    TripPayloadBase:
      type: object
      required: [tripId, tripVersion, requestId, reservationId, clientId, driverId]
      properties:
        tripId:
          type: string
          format: uuid
        tripVersion:
          type: integer
          minimum: 1
          description: Versión del viaje luego de la transición. Sirve para ordenar e ignorar eventos viejos.
        requestId:
          type: string
          format: uuid
        reservationId:
          $ref: '#/components/schemas/NullableId'
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid

    TripCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/TripPayloadBase'
        - type: object
          required: [vehicleId, vehicleType, createdAt]
          properties:
            vehicleId:
              type: string
              format: uuid
            vehicleType:
              $ref: '#/components/schemas/VehicleType'
            createdAt:
              type: string
              format: date-time

    DriverArrivedPayload:
      allOf:
        - $ref: '#/components/schemas/TripPayloadBase'
        - type: object
          required: [arrivedAt]
          properties:
            arrivedAt:
              type: string
              format: date-time

    TripStartedPayload:
      allOf:
        - $ref: '#/components/schemas/TripPayloadBase'
        - type: object
          required: [vehicleType, startedAt]
          properties:
            vehicleType:
              $ref: '#/components/schemas/VehicleType'
            startedAt:
              type: string
              format: date-time

    TripCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/TripPayloadBase'
        - type: object
          required: [vehicleType, startedAt, completedAt, distanceKm, durationSeconds]
          properties:
            vehicleType:
              $ref: '#/components/schemas/VehicleType'
            startedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
            distanceKm:
              type: number
              format: float
              minimum: 0
              description: Kilómetros recorridos, con decimales.
            durationSeconds:
              type: integer
              minimum: 0

    TripCancelledPayload:
      allOf:
        - $ref: '#/components/schemas/TripPayloadBase'
        - type: object
          required:
            - vehicleType
            - cancelledBy
            - reason
            - previousState
            - requiresRedispatch
            - createdAt
            - arrivedAt
            - startedAt
            - cancelledAt
          properties:
            vehicleType:
              $ref: '#/components/schemas/VehicleType'
            cancelledBy:
              $ref: '#/components/schemas/Role'
            reason:
              $ref: '#/components/schemas/CancellationReason'
            previousState:
              $ref: '#/components/schemas/TripState'
            requiresRedispatch:
              type: boolean
              description: Verdadero si M5 debe volver a buscar conductor para la solicitud.
            createdAt:
              type: string
              format: date-time
              description: Momento de la asignación. Junto con los demás instantes, le permite a M7 calcular el cargo.
            arrivedAt:
              $ref: '#/components/schemas/NullableDateTime'
            startedAt:
              $ref: '#/components/schemas/NullableDateTime'
            cancelledAt:
              type: string
              format: date-time
